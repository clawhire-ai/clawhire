<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Community Pack versus hosted ClawHire</title>
  <desc id="desc">The free Community Pack contains manual agent templates and workflows. Hosted ClawHire adds AI CEO discovery, automated coordination, persistent state, review and revisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0d"/><stop offset="1" stop-color="#170d16"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0b8"/><stop offset=".5" stop-color="#ff746b"/><stop offset="1" stop-color="#d84289"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d84289" stop-opacity=".28"/><stop offset="1" stop-color="#d84289" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="22" fill="url(#grid)"/>
  <circle cx="960" cy="230" r="330" fill="url(#glow)"/>
  <text x="52" y="54" fill="#f8f3ef" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">TAKE THE METHOD FOR FREE. RUN THE TEAM WITH CLAWHIRE.</text>
  <text x="52" y="82" fill="#908a93" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" font-size="15">免费带走方法与模板；付费获得持续运行的协作系统</text>

  <g transform="translate(52 116)" font-family="Inter,PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
    <rect width="500" height="348" rx="22" fill="#121217" stroke="#373039"/>
    <rect x="24" y="24" width="110" height="30" rx="15" fill="#262129"/>
    <text x="79" y="44" text-anchor="middle" fill="#c1bbc4" font-size="12" font-weight="800" letter-spacing="1.4">FREE · MIT</text>
    <text x="24" y="92" fill="#fff" font-size="29" font-weight="800">Community Pack</text>
    <text x="24" y="120" fill="#918b94" font-size="15">公开、无状态、由你手动调用</text>
    <g font-size="16">
      <g transform="translate(24 158)"><circle cx="9" cy="-5" r="9" fill="#ff746b" fill-opacity=".13" stroke="#ff746b"/><path d="m5-5 3 3 6-7" fill="none" stroke="#ff9a82" stroke-width="2"/><text x="32" fill="#ddd7dd">10 个轻量 Community Agents</text></g>
      <g transform="translate(24 205)"><circle cx="9" cy="-5" r="9" fill="#ff746b" fill-opacity=".13" stroke="#ff746b"/><path d="m5-5 3 3 6-7" fill="none" stroke="#ff9a82" stroke-width="2"/><text x="32" fill="#ddd7dd">3 个手动 Lite 工作流</text></g>
      <g transform="translate(24 252)"><circle cx="9" cy="-5" r="9" fill="#ff746b" fill-opacity=".13" stroke="#ff746b"/><path d="m5-5 3 3 6-7" fill="none" stroke="#ff9a82" stroke-width="2"/><text x="32" fill="#ddd7dd">1 个脱敏项目案例</text></g>
      <g transform="translate(24 299)"><circle cx="9" cy="-5" r="9" fill="#ff746b" fill-opacity=".13" stroke="#ff746b"/><path d="m5-5 3 3 6-7" fill="none" stroke="#ff9a82" stroke-width="2"/><text x="32" fill="#ddd7dd">复制、修改、单次运行</text></g>
    </g>
  </g>

  <g transform="translate(648 116)" font-family="Inter,PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
    <rect width="500" height="348" rx="22" fill="#181319" stroke="url(#brand)" stroke-width="1.5"/>
    <rect x="24" y="24" width="146" height="30" rx="15" fill="url(#brand)"/>
    <text x="97" y="44" text-anchor="middle" fill="#171014" font-size="12" font-weight="900" letter-spacing="1.2">PAID · INVITE</text>
    <text x="24" y="92" fill="#fff" font-size="29" font-weight="800">Hosted ClawHire</text>
    <text x="24" y="120" fill="#b5adb5" font-size="15">项目级、持续运行、由系统自动编排</text>
    <g font-size="16">
      <g transform="translate(24 158)"><circle cx="9" cy="-5" r="9" fill="#e8aa68" fill-opacity=".13" stroke="#e8aa68"/><path d="m5-5 3 3 6-7" fill="none" stroke="#f6d18b" stroke-width="2"/><text x="32" fill="#f1ebef">AI CEO 动态访谈与自动组队</text></g>
      <g transform="translate(24 205)"><circle cx="9" cy="-5" r="9" fill="#e8aa68" fill-opacity=".13" stroke="#e8aa68"/><path d="m5-5 3 3 6-7" fill="none" stroke="#f6d18b" stroke-width="2"/><text x="32" fill="#f1ebef">多模型调度、能力匹配与 Skill 进化</text></g>
      <g transform="translate(24 252)"><circle cx="9" cy="-5" r="9" fill="#e8aa68" fill-opacity=".13" stroke="#e8aa68"/><path d="m5-5 3 3 6-7" fill="none" stroke="#f6d18b" stroke-width="2"/><text x="32" fill="#f1ebef">共享上下文、协作复核与版本留存</text></g>
      <g transform="translate(24 299)"><circle cx="9" cy="-5" r="9" fill="#e8aa68" fill-opacity=".13" stroke="#e8aa68"/><path d="m5-5 3 3 6-7" fill="none" stroke="#f6d18b" stroke-width="2"/><text x="32" fill="#f1ebef">人工审批、退回修改与持续推进</text></g>
    </g>
  </g>

  <g transform="translate(576 268)"><circle cx="24" cy="0" r="24" fill="#100f14" stroke="#6a3b4b"/><path d="M14 0h20M28-6l6 6-6 6" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
</svg>
