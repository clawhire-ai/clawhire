<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ClawHire project flow</title>
  <desc id="desc">A goal is clarified by an AI CEO, executed by a coordinated AI team, and delivered for review and revision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090a0d"/><stop offset="1" stop-color="#160d16"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0b8"/><stop offset=".5" stop-color="#ff746b"/><stop offset="1" stop-color="#d84289"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff746b" stop-opacity=".2"/><stop offset=".5" stop-color="#e8aa68"/><stop offset="1" stop-color="#d84289" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <text x="52" y="52" fill="#f8f3ef" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750">ONE GOAL → ONE COORDINATED DELIVERY</text>
  <text x="52" y="79" fill="#8f8993" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" font-size="15">从一句目标，到一套可审核、可继续修改的项目成果</text>
  <path d="M173 193H1028" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <g fill="#e8aa68"><circle cx="280" cy="193" r="4"/><circle cx="590" cy="193" r="4"/><circle cx="900" cy="193" r="4"/></g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(52 118)">
      <rect width="210" height="152" rx="18" fill="#141419" stroke="#352d35"/>
      <circle cx="36" cy="38" r="18" fill="#ff746b" fill-opacity=".12" stroke="#ff746b"/>
      <path d="M29 38h14M36 31v14" stroke="#ff9a82" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="34" fill="#ff9a82" font-size="12" font-weight="800" letter-spacing="1.5">01 · GOAL</text>
      <text x="22" y="82" fill="#fff" font-size="22" font-weight="750">你的目标</text>
      <text x="22" y="112" fill="#99939c" font-size="14">想法、边界与关键决定</text>
      <text x="22" y="135" fill="#77727b" font-size="12">Idea · Context · Decisions</text>
    </g>
    <g transform="translate(342 118)">
      <rect width="210" height="152" rx="18" fill="#171318" stroke="#5b3742"/>
      <circle cx="36" cy="38" r="18" fill="#e8aa68" fill-opacity=".12" stroke="#e8aa68"/>
      <path d="M29 41c4-14 10-14 14 0M31 34h10" fill="none" stroke="#f6d18b" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="34" fill="#f6d18b" font-size="12" font-weight="800" letter-spacing="1.5">02 · AI CEO</text>
      <text x="22" y="82" fill="#fff" font-size="22" font-weight="750">访谈与规划</text>
      <text x="22" y="112" fill="#aaa3ab" font-size="14">形成共识、拆解任务、选岗</text>
      <text x="22" y="135" fill="#7c767f" font-size="12">Discover · Plan · Assemble</text>
    </g>
    <g transform="translate(632 118)">
      <rect width="210" height="152" rx="18" fill="#171318" stroke="#5b3742"/>
      <circle cx="36" cy="38" r="18" fill="#d84289" fill-opacity=".12" stroke="#d84289"/>
      <circle cx="31" cy="35" r="4" fill="none" stroke="#ec78ad" stroke-width="2"/><circle cx="42" cy="40" r="4" fill="none" stroke="#ec78ad" stroke-width="2"/>
      <text x="66" y="34" fill="#ec78ad" font-size="12" font-weight="800" letter-spacing="1.5">03 · AI TEAM</text>
      <text x="22" y="82" fill="#fff" font-size="22" font-weight="750">协作与复核</text>
      <text x="22" y="112" fill="#aaa3ab" font-size="14">共享上下文、交叉审核</text>
      <text x="22" y="135" fill="#7c767f" font-size="12">Execute · Review · Revise</text>
    </g>
    <g transform="translate(922 118)">
      <rect width="226" height="152" rx="18" fill="#161318" stroke="url(#brand)" stroke-width="1.5"/>
      <circle cx="36" cy="38" r="18" fill="#ff746b" fill-opacity=".12" stroke="#ff746b"/>
      <path d="M29 30h11l5 5v12H29zM40 30v6h5" fill="none" stroke="#ff9a82" stroke-width="2" stroke-linejoin="round"/>
      <text x="66" y="34" fill="#ff9a82" font-size="12" font-weight="800" letter-spacing="1.3">04 · DELIVERY</text>
      <text x="22" y="82" fill="#fff" font-size="22" font-weight="750">成果与版本</text>
      <text x="22" y="112" fill="#aaa3ab" font-size="14">审核、退回并继续修改</text>
      <text x="22" y="135" fill="#7c767f" font-size="12">Approve · Return · Continue</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
</svg>
